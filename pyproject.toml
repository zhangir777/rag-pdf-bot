[project]
name = "rag-pdf-bot"
version = "0.1.0"
description = "Telegram bot that answers questions about a PDF you send it, with page references (aiogram 3, BM25 search, Groq/Gemini free API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "pypdf>=5.0",
    "python-dotenv>=1.2.4",
    "sentry-sdk>=2.0",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
